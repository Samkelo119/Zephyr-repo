<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Panel Login — ZEPHYR-MD BOT</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: radial-gradient(circle at 20% 20%, #1b2a4a 0%, #0a0e1a 55%, #05070d 100%);
        color: #e6ecff;
    }
    .card {
        width: 360px; padding: 36px 32px; border-radius: 18px;
        background: linear-gradient(160deg, rgba(30,41,70,0.85), rgba(10,14,26,0.85));
        border: 1px solid rgba(90,140,255,0.25);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(60,110,255,0.08);
        backdrop-filter: blur(6px);
    }
    .logo { text-align: center; font-size: 40px; margin-bottom: 6px; }
    h1 { text-align: center; font-size: 18px; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 4px; }
    .sub { text-align: center; font-size: 12px; color: #8ea0c8; margin-bottom: 26px; }
    label { font-size: 12px; color: #9db0d8; display: block; margin-bottom: 6px; }
    input {
        width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(90,140,255,0.25);
        background: rgba(255,255,255,0.04); color: #e6ecff; font-size: 14px; outline: none;
        transition: border 0.2s;
    }
    input:focus { border-color: #4d8cff; }
    button {
        width: 100%; margin-top: 20px; padding: 12px; border: none; border-radius: 10px;
        background: linear-gradient(90deg, #2563eb, #4d8cff); color: #fff; font-weight: 600;
        font-size: 14px; cursor: pointer; letter-spacing: 0.5px; transition: transform 0.15s, opacity 0.15s;
    }
    button:hover { transform: translateY(-1px); opacity: 0.92; }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; color: #ff6b6b; }
    .footer { margin-top: 24px; text-align: center; font-size: 11px; color: #5a6b91; }
</style>
</head>
<body>
<div class="card">
    <div class="logo">🔐</div>
    <h1>ZEPHYR-MD ADMIN PANEL</h1>
    <div class="sub">Restricted Access · Authorized Personnel Only</div>
    <form id="loginForm">
        <label for="password">Admin Password</label>
        <input type="password" id="password" placeholder="Enter admin password" autocomplete="current-password" required />
        <button type="submit" id="submitBtn">Unlock Dashboard</button>
        <div class="msg" id="msg"></div>
    </form>
    <div class="footer">Powered by ZEPHYR-MD</div>
</div>
<script>
const form = document.getElementById('loginForm');
const msg = document.getElementById('msg');
const btn = document.getElementById('submitBtn');
form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    msg.style.color = '#8ea0c8';
    msg.textContent = 'Verifying...';
    try {
        const res = await fetch('/admin/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: document.getElementById('password').value })
        });
        const data = await res.json();
        if (data.ok) {
            window.location.href = '/admin/dashboard';
        } else {
            msg.style.color = '#ff6b6b';
            msg.textContent = data.error || 'Login failed.';
        }
    } catch (err) {
        msg.style.color = '#ff6b6b';
        msg.textContent = 'Network error. Try again.';
    }
    btn.disabled = false;
});
</script>
</body>
</html>
