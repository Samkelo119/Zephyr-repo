# Render Blueprint for ZEPHYR-MD
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render choose
#   New + -> Blueprint -> select the Zephyr-repo.
#
# FREE TIER — IMPORTANT
# This blueprint targets Render's FREE plan: there is no persistent disk, and
# a free web service spins down after ~15 minutes without traffic. That means
# auth_info/ (your WhatsApp session) and data/ are wiped whenever the service
# restarts or sleeps, so you will likely have to re-pair the number, and the
# bot will not stay online 24/7.
#
# To upgrade to a stay-paired, always-on bot later:
#   1. set `plan: 0.5c-512mb`
#   2. re-add the `disk:` block and the DATA_PERSIST_DIR env var (see DEPLOY.md)
services:
  - type: web
    name: zephyr-md-bot
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund && touch node_modules/.install-complete
    startCommand: node bootstrap.js
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Your WhatsApp number with country code, no "+" (e.g. 27621834910).
      - key: OWNER_NUMBER
        sync: false
      # Optional overrides — leave unset to use the built-in defaults.
      - key: ADMIN_PANEL_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
